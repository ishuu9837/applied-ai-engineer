name = "applied-ai-academy-api"
main = "index.mjs"
compatibility_date = "2026-11-05"
workers_dev = true

# Configure PUBLIC_ORIGIN with the *exact* URL of the Pages frontend.
# Set ALLOWED_EMAIL with: npx wrangler secret put ALLOWED_EMAIL --config worker/wrangler.toml
# Never place authentication secrets here or in Git.
[vars]
PUBLIC_ORIGIN = "https://REPLACE_WITH_YOUR_PAGES_DOMAIN.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "applied-ai-academy"
database_id = "REPLACE_WITH_YOUR_D1_UUID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "applied-ai-academy-private"

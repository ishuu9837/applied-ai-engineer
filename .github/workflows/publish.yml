name: Validate and release reviewed learning missions

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

concurrency:
  group: learning-content-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source and editorial content
        run: npm test
      - name: Release up to three reviewed lessons for today's IST date
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run release
      - name: Test and build public-only static files
        run: |
          npm test
          npm run build
      - name: Commit released mission files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/live/
          if ! git diff --cached --quiet; then
            git commit -m "content: release reviewed mission batch at midnight IST"
            git push
          else
            echo "No new reviewed missions were published."
          fi


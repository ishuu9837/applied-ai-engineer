name: Validate and release bootcamp lessons

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

concurrency:
  group: bootcamp-content-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate lesson content and release logic
        run: npm test
      - name: Publish scheduled reviewed batch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run release
      - name: Validate published content
        run: |
          npm test
          npm run build
      - name: Commit released lessons to GitHub
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/live/
          if ! git diff --cached --quiet; then
            git commit -m "content: publish prepared lessons for today (IST)"
            git push
          else
            echo "No new reviewed lessons to commit."
          fi

# Vercel deploys from main via its Git integration.
# Do not also configure Vercel Cron: GitHub Actions owns the content release schedule.

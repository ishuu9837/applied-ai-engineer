name: Validate, publish and deploy learning site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

concurrency:
  group: learning-site-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish scheduled batch when prepared
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run release
      - name: Validate lessons and release logic
        run: npm test
      - name: Commit newly released lesson data (scheduled/manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/live/
          if ! git diff --cached --quiet; then
            git commit -m "content: publish prepared lessons for today (IST)"
            git push
          else
            echo "No release files changed."
          fi
      - name: Create public-only static build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
